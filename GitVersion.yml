# GitVersion 6.x configuration (tool pinned in the read-only job `version` of .github/workflows/ci.yml; the job
# `release` tags every master commit with v + the validated MajorMinorPatch output of `version`). Docs: docs/releasing.md
workflow: GitHubFlow/v1

# FLOOR (verified on GitVersion 6.8.2, docs/releasing.md): the calculated version is raised to this value when it is
# lower, and ignored once the tags are higher. Raised to v4.0.0 so that the squash commit of the PR that starts
# Release 4 is tagged v4.0.0 by the release job (a tag only, no GitHub Release: the title is not breaking). After that
# tag exists the line is harmless (a docs commit computes 4.0.1, feat 4.1.0). Raise it again for Release 5 (v5.0.0).
next-version: v4.0.0

# Explicit on purpose: the tag `release-2` (pre-GitVersion) is not a version and must stay ignored.
tag-prefix: 'v'

commit-message-incrementing: Enabled

# Conventional Commits on the squash commit (= PR title). Anything that matches none of these
# (chore, docs, ci, test, refactor, ...) gets the branch increment of the preset (Patch). Every commit on
# master increments at least the patch version; "+semver: skip" does NOT opt out of that (verified on 6.8.2).
major-version-bump-message: '^\w+(\([^)]*\))?!:|(^|\n)BREAKING[ -]CHANGE:'
minor-version-bump-message: '^feat(\([^)]*\))?:'
patch-version-bump-message: '^(fix|perf)(\([^)]*\))?:'
