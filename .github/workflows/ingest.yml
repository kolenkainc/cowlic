name: ingest

# Manual only. Never add pull_request, pull_request_target or issue_comment triggers:
# this repo is public and those would hand secrets to untrusted code.
on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: Public Spotify playlist URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r ingest/requirements.txt

      - name: Validate playlist URL
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: |
          if ! printf '%s' "$PLAYLIST_URL" | grep -Eq '^https://open\.spotify\.com/playlist/[A-Za-z0-9]+(\?[A-Za-z0-9=&_.-]*)?$'; then
            echo "playlist_url must look like https://open.spotify.com/playlist/<id>" >&2
            exit 1
          fi

      - name: Run ingest
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID }}
        run: |
          set -o pipefail
          python ingest/ingest.py "$PLAYLIST_URL" 2>&1 | tee "$RUNNER_TEMP/ingest.log"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ingest result"
            echo
            if [ -f "$RUNNER_TEMP/ingest.log" ]; then
              echo '```'
              grep -E '^(done:|ERROR |WARN |ingested:)' "$RUNNER_TEMP/ingest.log" || echo "no result lines (see the step log)"
              echo '```'
            else
              echo "Ingest did not start (see the failed step)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
