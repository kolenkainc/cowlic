# Worker CI. Contract: docs/worker-cicd.md (section 12.1, rules in 3 and 5.1 rule 5a, pins in 6).
# Status check name: "Worker CI / ci" (stable on purpose: the owner's master ruleset requires the context "ci").
# pull_request has NO paths filter: the required check `ci` must be reported on every PR, or a PR that touches
# nothing under worker/ could never merge. The expensive steps are skipped by step-level `if:` (not a job-level
# `if:`: a skipped job reports "skipped", a job with skipped steps reports success) when neither worker/ nor this
# workflow changed. push to master stays path-filtered: nothing needs a run for a docs-only push, and the ruleset
# only needs the check on pull requests.
# No secrets and no `environment:` anywhere in this file. No pull_request_target (section 3 rule 3).
name: Worker CI

on:
  pull_request:
    # labeled/unlabeled: the destructive-migration gate below reads the PR labels, so a label change must re-run
    # the check. Cost: one short run per label change on every PR (seconds when worker/ is untouched).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/worker-ci.yml"
  # #292: the master ruleset has a merge queue and requires `ci`; the queue sends merge_group (checks_requested)
  # and waits for the required check on the gh-readonly-queue/* commit. No path filter: `ci` must always report.
  # This workflow never deploys; worker-deploy.yml must NOT get this trigger (asserted by test/workflow).
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Section 3 rule 5: superseded PR runs are cancelled (cancelling CI is fine; deploys are never cancelled).
# The event name is in the group and cancel-in-progress is true only for pull_request: a merge-queue run is never
# cancelled by a PR run or by another queue entry (each queue entry also has its own ref).
concurrency:
  group: worker-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #289: checks: write only for the "Test Report" check run (the report action creates it). Narrowest scope: this
    # job, no other. No pull-requests: write (PR comments are off). The token is not passed to any step but the report.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      # Pins: section 6 audit table (full commit SHAs). fetch-depth 0 is required: with depth 1 there is
      # no origin/master and no base commit, so the lint would exit 2 (section 12.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # BASE = the commit to compare against. Untrusted values come in through env: only (section 3 rule 7).
      # pull_request: current origin/master. push: the previous head of master. merge_group: the queue's
      # base_sha, and only if head_sha (40 lowercase hex, like base_sha) is the checked-out commit. If it
      # cannot be resolved, BASE_SHA stays empty: the detect step then treats worker/ as changed (run everything)
      # and the steps that need a base fail (fail closed, never "unchanged").
      - name: Resolve base commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          base=""
          is_sha() {
            case "$1" in
              *[!0-9a-f]* | "") return 1 ;;
            esac
            [ "${#1}" -eq 40 ]
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git rev-parse --verify --quiet "refs/remotes/origin/master^{commit}") || base=""
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if is_sha "$MG_BASE_SHA" && is_sha "$MG_HEAD_SHA"; then
              head=$(git rev-parse --verify --quiet "HEAD^{commit}") || head=""
              if [ "$head" = "$MG_HEAD_SHA" ]; then
                base=$(git rev-parse --verify --quiet "${MG_BASE_SHA}^{commit}") || base=""
              fi
            fi
          else
            case "$BEFORE_SHA" in
              *[!0-9a-f]* | "") base="" ;;
              *) if [ "${#BEFORE_SHA}" -eq 40 ]; then base=$(git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}") || base=""; fi ;;
            esac
          fi
          if [ -z "$base" ]; then
            echo "::warning::cannot resolve the base commit: the worker steps will run and fail closed"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      # worker_changed = any file under worker/ or this workflow or worker-deploy.yml (checked by the workflow tests of
      # "Vitest tests", #272) differs from the base. Fail closed: no base or a git failure means true. The pathspecs are :(top)-anchored because the job runs in worker/.
      - name: Detect worker changes
        id: changes
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "no base: treating worker as changed"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA"...HEAD -- ':(top)worker' ':(top).github/workflows/worker-ci.yml' ':(top).github/workflows/worker-deploy.yml' > "$RUNNER_TEMP/changed.txt"; then
            echo "git diff failed: treating worker as changed"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "worker changed"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under worker/ changed: worker steps skipped"
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.worker_changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # no cache at all (section 6)

      # Plain npm ci: this job has no secrets, and the smoke tests need the workerd install script (section 4.2 item 6).
      - name: Install dependencies
        if: steps.changes.outputs.worker_changed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.worker_changed == 'true'
        run: npx tsc --noEmit

      # Section 5.1 rule 5a. Applied migrations are immutable: a file that exists in the base and is modified,
      # renamed or deleted fails the job. Exit behaviour: diff output present -> exit 1; no output -> pass;
      # git failure (e.g. unreadable base) -> exit 1 as well (fail closed). Fix mistakes with a NEW migration.
      - name: Migrations are immutable
        if: steps.changes.outputs.worker_changed == 'true'
        run: |
          [ -n "$BASE_SHA" ] || { echo "no base commit"; exit 1; }
          changed=$(git diff --relative --name-status --diff-filter=MRD "$BASE_SHA"...HEAD -- migrations/)
          if [ -n "$changed" ]; then
            echo "Existing migration files must not be modified, renamed or deleted (add a new migration):"
            echo "$changed"
            exit 1
          fi
          echo "no applied migration changed"

      # Lint the migrations ADDED since the base, passed explicitly. The PR label destructive-migration-approved
      # (boolean computed here, never spliced into the script) turns destructive findings into notices.
      # #292: merge_group has no pull_request payload, so APPROVED is false there and a destructive finding fails
      # the queue run (fail closed, by choice); the PR run already showed the finding and the label.
      - name: Lint new migrations
        if: steps.changes.outputs.worker_changed == 'true'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'destructive-migration-approved') }}
        run: |
          [ -n "$BASE_SHA" ] || { echo "no base commit"; exit 1; }
          mapfile -d '' -t added < <(git diff --relative --name-only -z --diff-filter=A "$BASE_SHA"...HEAD -- 'migrations/*.sql')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "no new migrations to lint"
            exit 0
          fi
          args=()
          if [ "$APPROVED" = "true" ]; then args+=(--approved); fi
          node scripts/lint-migrations.mjs "${args[@]}" "${added[@]}"

      # #286 / #289: the linter gates destructive D1 migrations, and its own tests were wired nowhere. Runs exactly
      # one file (deliberate: another *.test.mjs is not picked up silently). Two reporters: spec to stdout (the
      # human-readable log) and junit to a file under RUNNER_TEMP (read by the "Test Report" step below, never
      # committed or uploaded). The node exit code is the verdict of THIS step: a failing test fails the job `ci`
      # whether or not the report can be published (fork PRs have a read-only token).
      - name: Migration lint tests
        id: lint_tests
        if: steps.changes.outputs.worker_changed == 'true'
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/lint-tests.xml" scripts/lint-migrations.test.mjs

      # #289: publishes the JUnit XML as an extra check run "Test Report" (NOT a required check, never read by the
      # deploy gate). Pinned by full SHA (docs/worker-cicd.md section 6 audit). Runs after a failed test step too
      # (to show the failure) but not when the test step was skipped (no XML) and not on a cancelled run.
      # fail_on_failure / require_tests: red report on a failed test or on zero collected tests (fail_on_parse_error:
      # an unreadable XML). comment is off, so no pull-requests: write. Fork PRs: the token is read-only, so creating
      # the check run fails; the action only logs that, and continue-on-error covers the rest on forks, while the
      # test step above still fails `ci` on a real failure.
      - name: Test Report
        id: test_report
        if: ${{ !cancelled() && (steps.lint_tests.outcome == 'success' || steps.lint_tests.outcome == 'failure') }}
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ runner.temp }}/lint-tests.xml
          check_name: Test Report
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          comment: false

      # MIN_TESTS: node:test counts a file that registers nothing as ONE passing test (tests 1, pass 1, exit 0), so
      # require_tests (total > 0) cannot catch an import-only file; the report action has no minimum-count option.
      # The floor is a pinned number below the real count (69 on 2026-10-14) so a few removals do not trip it but a
      # mass loss does. It compares the numeric `passed` output of the report step (no text parsing); skipped,
      # todo and cancelled tests do not count as passed. NOT dynamic: raise it deliberately when tests are added,
      # lower it deliberately when tests are removed on purpose.
      - name: Minimum test count
        if: ${{ steps.lint_tests.outcome == 'success' }}
        env:
          MIN_TESTS: "60"
          PASSED: ${{ steps.test_report.outputs.passed }}
        run: |
          case "$PASSED" in
            "" | *[!0-9]*) echo "passed count missing or not a number: '$PASSED'"; exit 1 ;;
          esac
          echo "passed=$PASSED (floor $MIN_TESTS)"
          if [ "$PASSED" -lt "$MIN_TESTS" ]; then
            echo "too few passed tests: a test file registers nothing or tests were lost"
            exit 1
          fi

      # #285: Vitest runs everything under worker/test in three projects: unit (paging, log-leak, CORS with stubbed D1
      # and Telegram), workflow (the run blocks of worker-deploy.yml, hostile titles, mutations; needs bash) and smoke
      # (the Worker on a REAL local D1 via wrangler, migrated and legacy schema; fake credentials, no secrets).
      # Two reporters: default to stdout and junit to a file under RUNNER_TEMP (read by the report step below). The
      # exit code of vitest is the verdict of THIS step: a failing test, zero collected tests (passWithNoTests
      # false) and a committed .only (allowOnly false) all fail it. No PR context: works on merge_group too.
      - name: Vitest tests
        id: vitest
        if: steps.changes.outputs.worker_changed == 'true'
        run: |
          npx vitest run --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/vitest.xml"

      # Same pinned action and options as "Test Report" above, its own check run (the minimum below is per runner).
      - name: Test Report (Vitest)
        id: vitest_report
        if: ${{ !cancelled() && (steps.vitest.outcome == 'success' || steps.vitest.outcome == 'failure') }}
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ runner.temp }}/vitest.xml
          check_name: Test Report (Vitest)
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          comment: false

      # Vitest has no switch against skipped tests and no minimum count, so both are checked here on the numeric
      # outputs of the report step (no text parsing): skipped must be 0 (a skipped test is a silently dropped check)
      # and passed must reach MIN_TESTS, a pinned number just below the real count (246 on 2026-10-14: 106 unit,
      # 43 workflow, 51 + 46 smoke) so one or two removals do not trip it but a lost file or area does. NOT dynamic:
      # raise it deliberately when tests are added, lower it deliberately when tests are removed on purpose.
      - name: Minimum test count (Vitest)
        if: ${{ steps.vitest.outcome == 'success' }}
        env:
          MIN_TESTS: "240"
          PASSED: ${{ steps.vitest_report.outputs.passed }}
          SKIPPED: ${{ steps.vitest_report.outputs.skipped }}
        run: |
          case "$PASSED$SKIPPED" in
            "" | *[!0-9]*) echo "passed/skipped count missing or not a number: '$PASSED' '$SKIPPED'"; exit 1 ;;
          esac
          echo "passed=$PASSED skipped=$SKIPPED (floor $MIN_TESTS)"
          if [ "$SKIPPED" -ne 0 ]; then
            echo "skipped tests are not allowed: remove the test or fix it"
            exit 1
          fi
          if [ "$PASSED" -lt "$MIN_TESTS" ]; then
            echo "too few passed tests: a test file registers nothing or tests were lost"
            exit 1
          fi
