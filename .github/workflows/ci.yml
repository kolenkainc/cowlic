# CI. Contract: docs/worker-cicd.md (section 12.1, rules in 3 and 5.1 rule 5a, pins in 6) and docs/releasing.md.
# One workflow for every check and for the Worker deploy (#290: part 1 merged version.yml and worker-ci.yml, part 2
# folded worker-deploy.yml in, part 3 added the release stage).
#
# Stages (jobs): changes (what changed), lint (typecheck, migrations), tests (migration lint tests and Vitest, with
# reports), version (GitVersion, read-only), ci (the gate), then plan -> migrate -> deploy (D1 migrations and the Worker
# deploy, #201 and #202), then release (tag and GitHub Release, the only job with contents: write). Check contexts
# (the job names; the UI shows "<workflow> / <job>"): `ci`, `changes`, `lint`, `tests`, `version`, `plan`, `migrate`,
# `deploy`, `release`, plus the report check runs "Test Report" and "Test Report (Vitest)".
# The owner's master ruleset requires the context `ci` (integration 15368): it is the gate job below, which always
# runs and reports on pull_request, push to master and merge_group.
#
# pull_request, push and merge_group have NO path or branch filter: a skipped workflow would leave the required check
# missing and block the PR or the queue. What is skipped instead is whole jobs (lint, tests) by the job-level `if:` on
# the output of `changes`, and the gate `ci` accepts a skipped job only when `changes` said it was not needed.
# `ci` itself has no condition except `always()` (a skipped required check counts as passed).
#
# DEPLOY RULES. plan, migrate and deploy run ONLY on push to master and on the manual workflow_dispatch from master,
# never on pull_request or merge_group (the queue's squash commit is the push to master that deploys) and never in a
# fork (job-level `if:` on the event, the ref and github.repository), and only when the gate `ci` of the SAME run
# succeeded (#287: the gate succeeds only when lint and tests succeeded or were not needed). Whether there is anything
# to deploy is decided in `plan` (step "Anything to deploy"): worker/ at this commit vs BASE, the commit of the most
# recent successful `production` deployment record (it moves once `migrate` succeeds; after a failed deploy or health
# check a later docs-only push does not retry, recovery is a workflow_dispatch), always yes for a dispatch.
# CONCURRENCY. The WORKFLOW-level group of a push to master or a dispatch from master is `worker-deploy`, with
# cancel-in-progress false: whole runs are serialized in push order, a running run (and so a running deploy or a
# migrate waiting for approval) is never cancelled, and GitHub keeps one pending run and replaces an older pending run
# by a newer one. Because the group is workflow-level, a replaced pending run is always OLDER than the run that
# survives, and the survivor's `plan` compares with what is live (BASE), so it deploys what the replaced run would
# have deployed. (Job-level groups on the deploy jobs were rejected: jobs would enter the group in the order their
# checks finish, not in push order, and a newer pending plan could be cancelled by an older one: nothing deployed.)
# There is NO job-level concurrency on the deploy jobs (the same group name at both levels would deadlock the run).
# pull_request, merge_group and everything not on master get their own groups, never `worker-deploy`.
# Secrets exist only as environment secrets, in the jobs migrate and deploy (the steps listed below); none anywhere
# else in this file. No pull_request_target (section 3 rule 3).
#
# Secrets (environment secrets of `production`: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID,
# WORKER_URL; `production-destructive`: the first three) are consumed in exactly these steps:
#   migrate: "Write runner-local wrangler config": D1_DATABASE_ID
#            "List pending migrations", "Time Travel bookmark", "Apply migrations", "Verify nothing is pending":
#            CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   deploy:  "Write runner-local wrangler config": D1_DATABASE_ID
#            "Mask the Worker URL": WORKER_URL
#            "Deploy": CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#            "Health check": WORKER_URL
# `npm ci` in migrate and deploy runs with no secrets in its environment. Nothing prints an id, no `set -x`, the
# generated config is never printed, committed or uploaded (no upload-artifact in this file). The `plan` job uses only
# the default GITHUB_TOKEN. The Worker's own secrets (TG_BOT_TOKEN, SUBSONIC_*) are never touched: `wrangler deploy`
# only, no `secret put`, and worker/wrangler.toml has no [vars].
name: CI

on:
  pull_request:
    # labeled/unlabeled: the destructive-migration gate below reads the PR labels, so a label change must re-run
    # the check. Cost: one short run per label change on every PR (seconds when worker/ is untouched).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
  # #292: the master ruleset has a merge queue and requires `ci`; the queue sends merge_group (checks_requested)
  # and waits for the required check on the gh-readonly-queue/* commit. No path filter: `ci` must always report.
  # The deploy jobs never run on merge_group (their `if:` names push and workflow_dispatch only; asserted by test/workflow).
  merge_group:
    types: [checks_requested]
  # Manual deploy (emergency, re-run, recovery): the head of master only (job-level `if:` on the ref, and the guard
  # in `plan`; the environments' branch policy "master" refuses every other ref as well). No inputs, on purpose.
  workflow_dispatch:

permissions:
  contents: read

# Section 3 rule 5: a run superseded by a new commit on the PR is cancelled (cancelling CI is fine; deploys are never
# cancelled). cancel-in-progress is true only for the pull_request actions opened, reopened and synchronize. A label
# event (labeled/unlabeled, for example review-completed being added) must NOT cancel the run in progress on the same
# commit: with always() the gate of a cancelled run would report a red `ci`. The label run waits in the group instead.
# Groups: push to master and dispatch from master -> `worker-deploy` (never cancelled, see DEPLOY RULES above);
# pull_request -> per PR ref; any other run (merge_group, a dispatch from another ref) -> its own run id, so a queue run
# is never cancelled or replaced and a dispatch from a feature branch can never take the place of a pending deploy run.
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'worker-deploy' || format('ci-{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) }}

jobs:
  # Stage 1: what changed. fetch-depth 0 is required: with depth 1 there is no origin/master and no base commit.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker_changed: ${{ steps.changes.outputs.worker_changed }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      # Pins: section 6 audit table (full commit SHAs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # BASE = the commit to compare against. Untrusted values come in through env: only (section 3 rule 7).
      # pull_request: current origin/master. push: the previous head of master. merge_group: the queue's
      # base_sha, and only if head_sha (40 lowercase hex, like base_sha) is the checked-out commit. If it
      # cannot be resolved, base_sha stays empty: the detect step then treats worker/ as changed (run everything)
      # and the steps that need a base fail (fail closed, never "unchanged"). The value is passed to the later jobs as
      # a job output (a git-resolved full SHA or empty).
      - name: Resolve base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          base=""
          is_sha() {
            case "$1" in
              *[!0-9a-f]* | "") return 1 ;;
            esac
            [ "${#1}" -eq 40 ]
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git rev-parse --verify --quiet "refs/remotes/origin/master^{commit}") || base=""
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if is_sha "$MG_BASE_SHA" && is_sha "$MG_HEAD_SHA"; then
              head=$(git rev-parse --verify --quiet "HEAD^{commit}") || head=""
              if [ "$head" = "$MG_HEAD_SHA" ]; then
                base=$(git rev-parse --verify --quiet "${MG_BASE_SHA}^{commit}") || base=""
              fi
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # a manual run has no before commit: the parent of the checked-out head (the checks cover the last commit)
            base=$(git rev-parse --verify --quiet "HEAD^1^{commit}") || base=""
          else
            case "$BEFORE_SHA" in
              *[!0-9a-f]* | "") base="" ;;
              *) if [ "${#BEFORE_SHA}" -eq 40 ]; then base=$(git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}") || base=""; fi ;;
            esac
          fi
          if [ -z "$base" ]; then
            echo "::warning::cannot resolve the base commit: the worker jobs will run and fail closed"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"

      # worker_changed = any file under worker/ or this workflow (checked by the workflow tests of "Vitest tests",
      # #272) differs from the base: lint and tests run. Fail closed: no base or a git failure means true. A manual
      # dispatch sets it to true (lint and tests must pass before a manual deploy too). The deploy decision is NOT made
      # here: `plan` asks whether worker/ differs from what is live. The pathspecs are :(top)-anchored so they do not
      # depend on the working directory.
      - name: Detect worker changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: lint and tests run"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "no base: treating worker as changed"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA"...HEAD -- ':(top)worker' ':(top).github/workflows/ci.yml' > "$RUNNER_TEMP/changed.txt"; then
            echo "git diff failed: treating worker as changed"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "worker changed"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under worker/ changed: lint and tests skipped"
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Stage 2: typecheck and migrations. A job-level `if:` is fine here: the gate `ci` decides what a skip means.
  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.worker_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # no cache at all (section 6)

      # Plain npm ci: this job has no secrets.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Section 5.1 rule 5a. Applied migrations are immutable: a file that exists in the base and is modified,
      # renamed or deleted fails the job. Exit behaviour: diff output present -> exit 1; no output -> pass;
      # git failure (e.g. unreadable base) -> exit 1 as well (fail closed). Fix mistakes with a NEW migration.
      - name: Migrations are immutable
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          [ -n "$BASE_SHA" ] || { echo "no base commit"; exit 1; }
          changed=$(git diff --relative --name-status --diff-filter=MRD "$BASE_SHA"...HEAD -- migrations/)
          if [ -n "$changed" ]; then
            echo "Existing migration files must not be modified, renamed or deleted (add a new migration):"
            echo "$changed"
            exit 1
          fi
          echo "no applied migration changed"

      # Lint the migrations ADDED since the base, passed explicitly. The PR label destructive-migration-approved
      # (boolean computed here, never spliced into the script) turns destructive findings into notices.
      # #292: merge_group has no pull_request payload, so APPROVED is false there and a destructive finding fails
      # the queue run (fail closed, by choice); the PR run already showed the finding and the label.
      - name: Lint new migrations
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'destructive-migration-approved') }}
        run: |
          [ -n "$BASE_SHA" ] || { echo "no base commit"; exit 1; }
          mapfile -d '' -t added < <(git diff --relative --name-only -z --diff-filter=A "$BASE_SHA"...HEAD -- 'migrations/*.sql')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "no new migrations to lint"
            exit 0
          fi
          args=()
          if [ "$APPROVED" = "true" ]; then args+=(--approved); fi
          node scripts/lint-migrations.mjs "${args[@]}" "${added[@]}"

  # Stage 3: tests. The only job with checks: write (the report action creates its check runs), narrowest scope:
  # this job, no other. No pull-requests: write (PR comments are off). The token goes to no step but the reports.
  tests:
    name: tests
    needs: changes
    if: ${{ needs.changes.outputs.worker_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # no cache at all (section 6)

      # Plain npm ci: this job has no secrets, and the smoke tests need the workerd install script (section 4.2 item 6).
      - name: Install dependencies
        run: npm ci

      # #286 / #289: the linter gates destructive D1 migrations, and its own tests were wired nowhere. Runs exactly
      # one file (deliberate: another *.test.mjs is not picked up silently). Two reporters: spec to stdout (the
      # human-readable log) and junit to a file under RUNNER_TEMP (read by the "Test Report" step below, never
      # committed or uploaded). The node exit code is the verdict of THIS step: a failing test fails the job `tests`
      # (and so the gate `ci`) whether or not the report can be published (fork PRs have a read-only token).
      - name: Migration lint tests
        id: lint_tests
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/lint-tests.xml" scripts/lint-migrations.test.mjs

      # #289: publishes the JUnit XML as an extra check run "Test Report" (NOT a required check, never read by the
      # deploy gate). Pinned by full SHA (docs/worker-cicd.md section 6 audit). Runs after a failed test step too
      # (to show the failure) but not when the test step was skipped (no XML) and not on a cancelled run.
      # fail_on_failure / require_tests: red report on a failed test or on zero collected tests (fail_on_parse_error:
      # an unreadable XML). comment is off, so no pull-requests: write. Fork PRs: the token is read-only, so creating
      # the check run fails; the action only logs that, and continue-on-error covers the rest on forks, while the
      # test step above still fails the job on a real failure.
      - name: Test Report
        id: test_report
        if: ${{ !cancelled() && (steps.lint_tests.outcome == 'success' || steps.lint_tests.outcome == 'failure') }}
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ runner.temp }}/lint-tests.xml
          check_name: Test Report
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          comment: false

      # MIN_TESTS: node:test counts a file that registers nothing as ONE passing test (tests 1, pass 1, exit 0), so
      # require_tests (total > 0) cannot catch an import-only file; the report action has no minimum-count option.
      # The floor is a pinned number below the real count (69 on 2026-10-14) so a few removals do not trip it but a
      # mass loss does. It compares the numeric `passed` output of the report step (no text parsing); skipped,
      # todo and cancelled tests do not count as passed. NOT dynamic: raise it deliberately when tests are added,
      # lower it deliberately when tests are removed on purpose.
      - name: Minimum test count
        if: ${{ steps.lint_tests.outcome == 'success' }}
        env:
          MIN_TESTS: "60"
          PASSED: ${{ steps.test_report.outputs.passed }}
        run: |
          case "$PASSED" in
            "" | *[!0-9]*) echo "passed count missing or not a number: '$PASSED'"; exit 1 ;;
          esac
          echo "passed=$PASSED (floor $MIN_TESTS)"
          if [ "$PASSED" -lt "$MIN_TESTS" ]; then
            echo "too few passed tests: a test file registers nothing or tests were lost"
            exit 1
          fi

      # #285: Vitest runs everything under worker/test in three projects: unit (paging, log-leak, CORS with stubbed D1
      # and Telegram), workflow (the run blocks of the deploy jobs of this file, hostile titles, mutations, and the static checks
      # of this file; needs bash) and smoke (the Worker on a REAL local D1 via wrangler, migrated and legacy schema;
      # fake credentials, no secrets). Two reporters: default to stdout and junit to a file under RUNNER_TEMP (read by
      # the report step below). The exit code of vitest is the verdict of THIS step: a failing test, zero collected
      # tests (passWithNoTests false) and a committed .only (allowOnly false) all fail it. No PR context: works on
      # merge_group too.
      - name: Vitest tests
        id: vitest
        run: |
          npx vitest run --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/vitest.xml"

      # Same pinned action and options as "Test Report" above, its own check run (the minimum below is per runner).
      - name: Test Report (Vitest)
        id: vitest_report
        if: ${{ !cancelled() && (steps.vitest.outcome == 'success' || steps.vitest.outcome == 'failure') }}
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ runner.temp }}/vitest.xml
          check_name: Test Report (Vitest)
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          comment: false

      # Vitest has no switch against skipped tests and no minimum count, so both are checked here on the numeric
      # outputs of the report step (no text parsing): skipped must be 0 (a skipped test is a silently dropped check)
      # and passed must reach MIN_TESTS, a pinned number just below the real count (518 on 2026-10-14: 106 unit, 315
      # workflow, 51 + 46 smoke) so a few removals do not trip it but a lost file or area does. NOT dynamic: raise it deliberately when tests are added,
      # lower it deliberately when tests are removed on purpose.
      - name: Minimum test count (Vitest)
        if: ${{ steps.vitest.outcome == 'success' }}
        env:
          MIN_TESTS: "512"
          PASSED: ${{ steps.vitest_report.outputs.passed }}
          SKIPPED: ${{ steps.vitest_report.outputs.skipped }}
        run: |
          case "$PASSED$SKIPPED" in
            "" | *[!0-9]*) echo "passed/skipped count missing or not a number: '$PASSED' '$SKIPPED'"; exit 1 ;;
          esac
          echo "passed=$PASSED skipped=$SKIPPED (floor $MIN_TESTS)"
          if [ "$SKIPPED" -ne 0 ]; then
            echo "skipped tests are not allowed: remove the test or fix it"
            exit 1
          fi
          if [ "$PASSED" -lt "$MIN_TESTS" ]; then
            echo "too few passed tests: a test file registers nothing or tests were lost"
            exit 1
          fi

  # Calculates the GitVersion version and prints it in the job summary. Read-only: it never tags or releases.
  # Contract: docs/releasing.md. Config: GitVersion.yml (GitVersion 6.x, GitHubFlow/v1). Runs on every event, also on
  # merge_group. It is NOT part of the gate (as before: it was never a required check), so a GitVersion problem on
  # an unusual ref cannot stall the queue; the job reports its own check `version`.
  version:
    name: version
    # Pinned image (not -latest): the audited image ships .NET SDK 8, 9 and 10.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Exact tool version (audit in docs/releasing.md). Never upgrade without confirmation.
      GITVERSION_TOOL_VERSION: "6.8.2"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      # Same pin as above. fetch-depth 0: GitVersion needs the full history and all tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GitVersion.Tool
        run: |
          dotnet --list-sdks
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version "$GITVERSION_TOOL_VERSION"

      # Branch/ref names reach GitVersion through the runner environment (GITHUB_REF), never through the command line.
      - name: Calculate version
        run: |
          "$RUNNER_TEMP/gitversion/dotnet-gitversion" . /output json /verbosity Quiet > "$RUNNER_TEMP/gitversion.json"
          {
            echo "### Version"
            echo
            echo "| Variable | Value |"
            echo "|---|---|"
            for key in SemVer FullSemVer MajorMinorPatch PreReleaseLabel CommitsSinceVersionSource VersionSourceSha; do
              echo "| $key | \`$(jq -r --arg k "$key" '.[$k] // ""' "$RUNNER_TEMP/gitversion.json")\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Calculated version: " + .FullSemVer' "$RUNNER_TEMP/gitversion.json"

  # The gate: the REQUIRED check `ci`. Always runs (a skipped required check counts as passed, so there is no other
  # condition, ever) and aggregates the needed jobs. `changes` must have succeeded and say true or false; when worker
  # files changed, `lint` and `tests` must have succeeded; otherwise they may be skipped (not needed). Failed,
  # cancelled or any unexpected result fails the gate. No checkout, no secrets: only the results come in, through env.
  ci:
    name: ci
    needs: [changes, lint, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker_changed }}
          LINT_RESULT: ${{ needs.lint.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "changes=$CHANGES_RESULT worker_changed=$WORKER_CHANGED lint=$LINT_RESULT tests=$TESTS_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes did not succeed"
            exit 1
          fi
          case "$WORKER_CHANGED" in
            true) allowed="success" ;;
            false) allowed="success skipped" ;;
            *) echo "worker_changed is missing or invalid: '$WORKER_CHANGED'"; exit 1 ;;
          esac
          fail=0
          for pair in "lint=$LINT_RESULT" "tests=$TESTS_RESULT"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            ok=0
            for a in $allowed; do
              if [ "$result" = "$a" ]; then ok=1; fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "$name: '$result' is not acceptable (allowed: $allowed)"
              fail=1
            fi
          done
          exit "$fail"

  # ORDER RULE (enforced by `needs`): plan -> migrate -> deploy. Migrate first, deploy second: a failed, rejected or
  # cancelled migrate job means `deploy` never starts. The Worker that is live between migrate and deploy is the OLD
  # code on the NEW schema, and a rollback of the Worker leaves the NEW schema under OLD code, so every migration must
  # work with and without the code that uses it (design section 5.1 rule 2, as the indexes of #122).
  #
  # plan runs only when: the gate `ci` of this run succeeded (it succeeds only when lint and tests succeeded or were
  # legitimately skipped because nothing relevant changed; `!cancelled()` is there because lint and tests are skipped
  # for a docs-only push and a skipped need would otherwise skip plan, which must still run to ask what is live), this
  # is the repository itself (not a fork), the ref is master, and the event is a push or a manual dispatch.
  # pull_request and merge_group never match. Whether there is anything to deploy is decided by the step "Anything to
  # deploy" below (worker/ vs the last deployment), not by the path of the push.
  # Guard (section 3 rule 5): an older run that was queued must not deploy after a newer commit landed on master.
  # Then (#202, section 12.2): BASE, immutability of applied migrations, lint of the migrations added since BASE and
  # the routing of `migrate` to `production` or `production-destructive`. No secrets, no environment: only the default
  # GITHUB_TOKEN, with the two extra read permissions this job needs (deployments for BASE, pull-requests for the label).
  plan:
    name: plan
    needs: [changes, lint, tests, ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.repository == 'kolenkainc/cowlic' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # commits/<sha>/pulls: the label of the PR that added a destructive migration
      deployments: read # deployments of `production`: BASE
    outputs:
      # true only when the guard says this commit may deploy AND worker/ differs from what is live (step "Anything to deploy")
      deploy: ${{ steps.guard.outputs.deploy == 'true' && steps.scope.outputs.deploy == 'true' && 'true' || 'false' }}
      # `production` or `production-destructive`; only these two literals are ever written (see "Classify")
      environment: ${{ steps.classify.outputs.environment }}
      # Subject line of the commit, already reduced to a safe charset (see "Commit title"); the `deploy` job re-checks it
      commit_title: ${{ steps.title.outputs.title }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Guard (master ref, sha is the master head)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          # github.sha / github.ref / github.repository are not user-controlled text, but they go through env anyway.
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_REF" != "refs/heads/master" ]; then
            echo "::error::this workflow deploys from master only"
            exit 1
          fi
          # Fail closed: if the head of master cannot be read, nothing is deployed.
          if ! head_sha=$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha); then
            echo "::error::cannot read the head of master"
            exit 1
          fi
          case "$head_sha" in
            *[!0-9a-f]*) echo "::error::unexpected master head value"; exit 1 ;;
          esac
          if [ "${#head_sha}" -ne 40 ]; then
            echo "::error::unexpected master head value"
            exit 1
          fi
          if [ "$head_sha" = "$EVENT_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "commit $EVENT_SHA is the head of master"
            exit 0
          fi
          # Master moved on. Whether the newer commits start a deploy run of their own depends on the path filter
          # (worker/**): a docs-only or ingest-only commit starts none, so skipping would silently leave production
          # on old code. Compare sha...head: the status must be "ahead" (sha is an ancestor of the head), and the
          # files in between decide: no worker/ file (a rename out of worker/ counts too) -> deploy sha (its worker/
          # content equals the head's); a worker/ file -> a newer run with a worker/ change exists and deploys, so
          # skip. The compare response lists at most 300 files: reaching that is treated as unknown and FAILS (deploying
          # an older sha when unsure could put old code over a newer commit). Any other status or error fails closed.
          if ! cmp=$(gh api "repos/$REPO/compare/$EVENT_SHA...$head_sha" --jq '.status, (.files | length), ([.files[] | select((.filename | startswith("worker/")) or ((.previous_filename // "") | startswith("worker/")))] | length)'); then
            echo "::error::cannot compare the commit with the head of master"
            exit 1
          fi
          { read -r cmp_status; read -r cmp_files; read -r cmp_worker; } <<< "$cmp"
          case "$cmp_files$cmp_worker" in
            "" | *[!0-9]*) echo "::error::unexpected compare result"; exit 1 ;;
          esac
          if [ "$cmp_status" != "ahead" ]; then
            echo "::error::unexpected compare status (the commit is not an ancestor of the master head)"
            exit 1
          fi
          if [ "$cmp_files" -ge 300 ]; then
            echo "::error::too many changed files between the commit and the master head to decide; start the run for the head by hand"
            exit 1
          fi
          if [ "$cmp_worker" -eq 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "master moved on, but no worker/ file changed after $EVENT_SHA: deploying this commit"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipped: a newer commit on master changes worker/ and has its own deploy run"
            {
              echo "### Worker deploy skipped"
              echo
              echo "Commit \`$EVENT_SHA\` is no longer the head of master and a newer commit changes \`worker/\`: that commit has its own deploy run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything below runs only when the guard decided to deploy this commit. fetch-depth 0: BASE..sha needs history
      # (a shallow clone has neither the base commit nor a usable `git log` over a range).
      - name: Checkout
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # no cache at all (section 6)

      # BASE = the commit whose migrations are already live: the commit of the last SUCCESSFUL deployment to the
      # environment `production` (section 12.2). Why not github.event.before or the previous master head: a replaced
      # pending run or a failed run would drop its migrations from the next run's range, and a destructive one could
      # then no longer be routed to the approval environment.
      # BASE is advisory: anyone with write access can create deployment records. The authority is the `migrate` job
      # (pending list of the remote DB, re-lint without --approved in `production`, environment approval).
      # Fallback when there is no successful deployment yet (the first run) or the API fails: push -> the `before`
      # commit of the event, workflow_dispatch -> the parent of the commit. BASE must exist and be an ancestor of the
      # commit (force pushes are blocked on master), otherwise the job fails closed.
      - name: Resolve BASE
        id: base
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          is_sha() {
            case "$1" in
              "" | *[!0-9a-f]*) return 1 ;;
            esac
            [ "${#1}" -eq 40 ]
          }
          base=""
          source=""
          if listing=$(gh api "repos/$REPO/deployments?environment=production&per_page=30" --jq '.[] | "\(.id) \(.sha)"'); then
            while read -r dep_id dep_sha; do
              case "$dep_id" in
                "" | *[!0-9]*) continue ;;
              esac
              is_sha "$dep_sha" || continue
              # statuses are newest first: the first one is the current state of the deployment
              if state=$(gh api "repos/$REPO/deployments/$dep_id/statuses?per_page=1" --jq '.[0].state // ""') && [ "$state" = "success" ]; then
                base="$dep_sha"
                source="last successful deployment to production"
                break
              fi
            done <<< "$listing"
          else
            echo "::warning::cannot read the deployments of production: using the fallback base"
          fi
          if [ -z "$base" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              base="$BEFORE_SHA"
              source="fallback: the before commit of the push"
            else
              base=$(git rev-parse --verify --quiet "${EVENT_SHA}^1^{commit}") || base=""
              source="fallback: the parent of the commit"
            fi
          fi
          if ! is_sha "$base"; then
            echo "::error::cannot determine the BASE commit"
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}"; then
            echo "::error::the BASE commit is not in the clone"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "$EVENT_SHA"; then
            echo "::error::the BASE commit is not an ancestor of the commit"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "BASE $base ($source)"
          {
            echo "### Worker deploy plan"
            echo
            echo "- Commit: \`$EVENT_SHA\`"
            echo "- BASE: \`$base\` ($source)"
          } >> "$GITHUB_STEP_SUMMARY"

      # #290 part 2 (the only step added to the old plan job). The old workflow decided "is there anything to deploy"
      # outside, with the path filter `worker/**` of the push. Every push to master reaches this job now, so that the run
      # that survives a replaced pending run can deploy what the replaced run would have: the question is asked against
      # what is LIVE, BASE (the commit of the most recent successful `production` deployment record, resolved above; it
      # moves once `migrate` succeeds, so after a failed deploy or health check recovery is a workflow_dispatch) vs this
      # commit, worker/ only.
      # A manual dispatch always deploys. Any git failure means deploy (a redundant deploy is idempotent and still behind
      # the guard, the gate and the migrate approval; a missed one is silent). The later steps of this job run for a
      # docs-only push too (they find nothing to check between BASE and the commit); the job output `deploy` is what
      # `migrate` and `deploy` read.
      - name: Anything to deploy (worker/ since BASE)
        id: scope
        if: steps.guard.outputs.deploy == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.base.outputs.base }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: deploying"
            exit 0
          fi
          rc=0
          git diff --quiet "$BASE_SHA" "$EVENT_SHA" -- worker/ || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "worker/ is the same as in the last deployment: nothing to deploy"
            {
              echo "### Worker deploy: nothing to deploy"
              echo
              echo "- \`worker/\` at \`$EVENT_SHA\` equals \`worker/\` at BASE \`$BASE_SHA\` (the last successful deployment to production)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$rc" -ne 1 ]; then
              echo "::warning::cannot compare worker/ with BASE: deploying"
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "worker/ differs from the last deployment (or the comparison failed): deploying"
          fi

      # Section 5.1 rule 5a, here and not only in CI: a direct push could bypass CI, and the check must fail before
      # `migrate` is even offered for approval. Applied migrations are immutable: a file that exists in BASE and is
      # modified, renamed, deleted or changes type fails the run. A migration that was merged but never applied is
      # not affected (BASE..sha sees it as added and it is linted at its final content). Fix mistakes with a NEW
      # migration. No label bypasses this. A git failure fails the step (fail closed).
      - name: Migrations are immutable
        if: steps.guard.outputs.deploy == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          changed=$(git diff --name-status --diff-filter=MRDT "$BASE_SHA" "$EVENT_SHA" -- worker/migrations/)
          if [ -n "$changed" ]; then
            echo "::error::existing migration files must not be modified, renamed or deleted (add a new migration)"
            echo "$changed"
            exit 1
          fi
          echo "no applied migration changed since BASE"

      # Lint exactly the migrations ADDED in BASE..sha, one file per run so that the findings of each can be told
      # apart. Result per file: exit 0 -> fine (warnings such as ADD COLUMN are fine); exit 1 and exit 0 again with
      # --approved -> only destructive findings (routed, below); anything else (a missing IF NOT EXISTS, a parse
      # error, exit 2) -> the run fails. A destructive file needs the label destructive-migration-approved on the
      # merged PR whose commit ADDED that file (a label on an unrelated PR in the range does not count); the label only
      # selects the route, the authorisation is the owner's approval of the environment `production-destructive`.
      # Names are matched against an allowlist before they are used or printed; the label is read from the API
      # response with jq (never spliced into a script). Any API failure counts as "no label" (fail closed).
      - name: Classify the new migrations
        id: classify
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.base }}
          EVENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          git diff -z --name-only --diff-filter=A "$BASE_SHA" "$EVENT_SHA" -- 'worker/migrations/*.sql' > "$RUNNER_TEMP/added.z"
          mapfile -d '' -t added < "$RUNNER_TEMP/added.z"
          destructive=()
          for f in "${added[@]}"; do
            if ! [[ "$f" =~ ^worker/migrations/[A-Za-z0-9._-]+\.sql$ ]]; then
              echo "::error::a new migration has an unexpected path (allowed: worker/migrations/<name>.sql with [A-Za-z0-9._-])"
              exit 1
            fi
            rc=0
            node worker/scripts/lint-migrations.mjs "$f" || rc=$?
            if [ "$rc" -eq 0 ]; then
              continue
            fi
            if [ "$rc" -eq 1 ] && node worker/scripts/lint-migrations.mjs --approved "$f" > /dev/null; then
              echo "destructive migration: $f (needs the label and the owner's approval)"
              destructive+=("$f")
              continue
            fi
            echo "::error::migration $f fails the lint with a finding that no approval can waive (exit $rc)"
            exit 1
          done
          environment="production"
          for f in "${destructive[@]}"; do
            git log --diff-filter=A --format=%H "$BASE_SHA..$EVENT_SHA" -- "$f" > "$RUNNER_TEMP/adders.txt"
            if ! [ -s "$RUNNER_TEMP/adders.txt" ]; then
              echo "::error::cannot find the commit that added $f"
              exit 1
            fi
            while read -r c; do
              case "$c" in
                "" | *[!0-9a-f]*) echo "::error::unexpected commit value"; exit 1 ;;
              esac
              if ! gh api "repos/$REPO/commits/$c/pulls" > "$RUNNER_TEMP/pulls.json"; then
                echo "::error::cannot read the pull requests of commit $c"
                exit 1
              fi
              labelled=$(jq --arg c "$c" 'any(.[]; .merged_at != null and .merge_commit_sha == $c and any(.labels[]; .name == "destructive-migration-approved"))' "$RUNNER_TEMP/pulls.json")
              if [ "$labelled" != "true" ]; then
                echo "::error::$f is destructive and the merged PR of commit $c does not carry the label destructive-migration-approved: nothing is applied, nothing is deployed"
                exit 1
              fi
            done < "$RUNNER_TEMP/adders.txt"
            environment="production-destructive"
          done
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          {
            echo "- New migration files since BASE: ${#added[@]} (destructive: ${#destructive[@]})"
            for f in "${added[@]}"; do echo "  - \`$f\`"; done
            if [ "${#destructive[@]}" -gt 0 ]; then
              echo "- DESTRUCTIVE (the owner's approval of \`production-destructive\` applies \`--approved\` to ALL pending files; the approval screen lists no files, so check this list and the pending list of \`migrate\` first):"
              for f in "${destructive[@]}"; do echo "  - \`$f\`"; done
            fi
            echo "- \`migrate\` runs in the environment \`$environment\`"
            echo "- The classification is advisory: \`migrate\` lists the pending migrations of the remote DB and re-lints them"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "migrate environment: $environment"

      # #272: the subject line of the commit for the message of the Worker version ("GitHub Actions run <id>: <title>").
      # The title is UNTRUSTED text (anyone who can merge writes it; a squash merge takes it from the PR title). It is read
      # with the API (same source for push and workflow_dispatch; the push payload has no commit for a dispatch), only
      # the first line is kept, then every character outside [A-Za-z0-9 ._,:;()#/+-] is replaced by a space (this removes
      # quotes, backticks, $, newlines, control characters and all non-ASCII), runs of spaces are squeezed, the result is
      # trimmed and cut to 100 characters. It travels through env and GITHUB_OUTPUT only: never into a run block through
      # ${{ }}, never into a command line unquoted. Cosmetic data: a failure to read it does not stop the deploy.
      - name: Commit title
        id: title
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          title=""
          if raw=$(gh api "repos/$REPO/commits/$EVENT_SHA" --jq '(.commit.message // "") | split("\n")[0] // ""'); then
            title=$(printf '%s' "$raw" | LC_ALL=C tr -c 'A-Za-z0-9 ._,:;()#/+-' ' ' | LC_ALL=C tr -s ' ' | LC_ALL=C cut -c1-100 | sed -e 's/^ //' -e 's/ $//')
          else
            echo "::warning::cannot read the commit title: the version message will say so"
            title="(title unavailable)"
          fi
          if [ -z "$title" ]; then
            title="(no title)"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          # Safe to print: only the charset above, and the fixed prefix means the line cannot start with a workflow command.
          echo "commit title: $title"

  # Migrations (#202, design sections 5 and 12.2). Runs in the environment that `plan` computed: `production` (the
  # new migrations are not destructive) or `production-destructive` (the owner is a required reviewer: the job
  # WAITS for the approval and does not start when the owner rejects, so nothing is applied and `deploy` is skipped).
  # `if:` accepts exactly those two names: an environment name that does not exist would be created by GitHub
  # without protection, so nothing else is ever passed.
  # This job always runs when a deploy is planned, also when `plan` saw no new migration file: the pending list of
  # the remote DB is the authority (a hand-applied migration is not pending, a merged-but-never-applied one is), and
  # "nothing pending" is a green no-op. Pending files are re-linted explicitly: WITHOUT --approved in `production`
  # (a destructive file that `plan` did not route fails closed), with --approved only in `production-destructive`.
  # A Time Travel bookmark is read BEFORE applying and written to the summary with the restore command; if it cannot
  # be read nothing is applied. wrangler 4.149.0 applies migration after migration (each file plus the insert into
  # d1_migrations as one query) and stops at the first error: the job fails, `deploy` is skipped. Whether a file is
  # atomic on D1 is not documented, so the bookmark is the recovery point (design section 5.2).
  # While `migrate` waits for an approval the concurrency group is held: newer runs queue behind it (one pending run is
  # kept) and their BASE still contains the unapproved migration, so it stays routed to the approval.
  migrate:
    name: migrate
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && (needs.plan.outputs.environment == 'production' || needs.plan.outputs.environment == 'production-destructive')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      # Pins: section 6 audit table (full commit SHAs). Depth 1 is enough here: the files to lint are in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # no cache at all (section 6)

      # No secrets in this step's environment: install scripts of dependencies never see the token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Same step as in `deploy` (section 4.2): validate, mask, substitute. Never printed.
      - name: Write runner-local wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node --input-type=module - <<'EOF'
          const id = process.env.D1_DATABASE_ID ?? "";
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) {
            console.error("::error::D1_DATABASE_ID is missing or not a lowercase UUID");
            process.exit(1);
          }
          EOF
          echo "::add-mask::$D1_DATABASE_ID"
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const placeholder = "REPLACE_AFTER_d1_create";
          const src = readFileSync("wrangler.toml", "utf8");
          if (src.split(placeholder).length !== 2) {
            console.error("::error::wrangler.toml must contain the D1 placeholder exactly once");
            process.exit(1);
          }
          const out = src.replace(placeholder, () => process.env.D1_DATABASE_ID);
          if (out.includes(placeholder)) {
            console.error("::error::placeholder still present");
            process.exit(1);
          }
          writeFileSync("wrangler.ci.toml", out, { mode: 0o600 });
          console.log("runner-local config written");
          EOF

      # CI=true makes wrangler skip the confirmation prompt of `migrations apply` (checked in the source of the pinned
      # wrangler 4.149.0: a prompt without a TTY or in CI takes its fallback value "yes"). GitHub sets CI itself; it is
      # repeated here so that the behaviour does not depend on the runner image. The wrangler output goes to a file and
      # is printed only on failure (GitHub masks the known ids; the first real run's log is scanned for leaks).
      # `list` also creates the d1_migrations table when it is missing (idempotent).
      - name: List pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          if ! npx wrangler d1 migrations list cowlic --remote -c wrangler.ci.toml > "$RUNNER_TEMP/pending.txt" 2>&1; then
            echo "::error::wrangler d1 migrations list failed; its output follows"
            cat "$RUNNER_TEMP/pending.txt"
            exit 1
          fi

      # No secrets. Parses the table of `migrations list` ("Migrations to be applied:" with one name per row) or the
      # line "No migrations to apply!". Anything else, or both, fails closed. Every name is checked against an
      # allowlist and must exist as a file in the checkout; names are the only values passed on.
      - name: Read the pending migrations
        id: pending
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";
          const text = readFileSync(process.env.RUNNER_TEMP + "/pending.txt", "utf8").replace(/\u001b\[[0-9;]*m/g, "");
          const none = text.includes("No migrations to apply");
          const at = text.indexOf("Migrations to be applied:");
          const names = [];
          if (at >= 0) {
            // Every non-empty line after the heading must be a border line or a one-cell row. A line that is neither
            // (a changed table layout, a warning, a row with extra separators) fails the step: a file that was
            // silently dropped here would still be applied by wrangler, but never linted.
            const lines = text.slice(at).split("\n").slice(1);
            for (const raw of lines) {
              const line = raw.trim();
              if (line === "" || /^[┌├└][─┬┼┴]*[┐┤┘]$/.test(line)) continue;
              const m = /^│\s*([^│]*?)\s*│$/.exec(line);
              if (!m) {
                console.error("::error::unexpected line in the output of wrangler d1 migrations list");
                process.exit(1);
              }
              if (m[1].toLowerCase() !== "name") names.push(m[1]);
            }
          }
          if (none === at >= 0 || (at >= 0 && names.length === 0)) {
            console.error("::error::unexpected output of wrangler d1 migrations list");
            process.exit(1);
          }
          for (const n of names) {
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*\.sql$/.test(n) || !existsSync("migrations/" + n)) {
              console.error("::error::a pending migration has an unexpected name or is not in this checkout");
              process.exit(1);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "count=" + names.length + "\nnames=" + names.join(" ") + "\n");
          if (names.length === 0) {
            console.log("no pending migrations");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### D1 migrations\n\n- No pending migrations: nothing to apply\n");
          } else {
            console.log("pending migrations: " + names.join(" "));
          }
          EOF

      # Defence in depth and the real gate: the pending files are linted explicitly. `production` runs the lint
      # WITHOUT --approved, so any destructive statement (or a missing IF NOT EXISTS) fails the job before anything is
      # applied. Only the environment `production-destructive` (reached after the owner's approval) adds --approved.
      # Warnings (ADD COLUMN, as in 0003) do not fail the lint and are not destructive.
      - name: Lint the pending migrations
        if: steps.pending.outputs.count != '0'
        env:
          TARGET_ENV: ${{ needs.plan.outputs.environment }}
          PENDING: ${{ steps.pending.outputs.names }}
        run: |
          args=()
          if [ "$TARGET_ENV" = "production-destructive" ]; then
            args+=(--approved)
          fi
          files=()
          for n in $PENDING; do
            files+=("migrations/$n")
          done
          if ! node scripts/lint-migrations.mjs "${args[@]}" "${files[@]}"; then
            echo "::error::lint of the pending migrations failed: nothing is applied"
            exit 1
          fi

      # Fail closed: no bookmark, no apply. `--json` prints the API result ({"bookmark": "..."}); the shape is checked
      # in the next step. Only stderr is shown on failure (the JSON is not printed).
      - name: Time Travel bookmark
        if: steps.pending.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          if ! npx wrangler d1 time-travel info cowlic --json -c wrangler.ci.toml > "$RUNNER_TEMP/bookmark.json" 2> "$RUNNER_TEMP/bookmark.err"; then
            echo "::error::cannot read the Time Travel bookmark: nothing is applied"
            cat "$RUNNER_TEMP/bookmark.err"
            exit 1
          fi

      - name: Record the bookmark
        id: bookmark
        if: steps.pending.outputs.count != '0'
        env:
          PENDING: ${{ steps.pending.outputs.names }}
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";
          const raw = readFileSync(process.env.RUNNER_TEMP + "/bookmark.json", "utf8");
          let bookmark = "";
          try {
            const o = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
            if (o && typeof o.bookmark === "string") bookmark = o.bookmark;
          } catch {
            // not JSON: the check below decides
          }
          if (!/^[0-9A-Za-z][0-9A-Za-z-]{15,199}$/.test(bookmark)) {
            console.error("::error::the Time Travel output has no usable bookmark: nothing is applied");
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "bookmark=" + bookmark + "\n");
          const q = String.fromCharCode(96);
          const fence = q + q + q;
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            "### D1 migrations: about to apply\n\n" +
              "- Pending: " + process.env.PENDING.split(" ").map((n) => q + n + q).join(", ") + "\n" +
              "- Time Travel bookmark before applying: " + q + bookmark + q + "\n\n" +
              "Restore (owner, from worker/ on the owner's machine; overwrites the database in place and asks for confirmation):\n\n" +
              fence + "\nnpx wrangler d1 time-travel restore cowlic --bookmark=" + bookmark + " -c wrangler.local.toml\n" + fence + "\n",
          );
          console.log("bookmark recorded in the job summary");
          EOF

      # The apply itself. wrangler stops at the first failing migration and exits non-zero. A hung prompt would be
      # stopped by the step timeout.
      - name: Apply migrations
        id: apply
        if: steps.pending.outputs.count != '0'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          npx wrangler d1 migrations apply cowlic --remote -c wrangler.ci.toml

      # Idempotency proof: right after the apply nothing may be pending any more.
      - name: Verify nothing is pending
        id: verify
        if: steps.apply.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          if ! npx wrangler d1 migrations list cowlic --remote -c wrangler.ci.toml > "$RUNNER_TEMP/after.txt" 2>&1; then
            echo "::error::wrangler d1 migrations list failed after the apply; its output follows"
            cat "$RUNNER_TEMP/after.txt"
            exit 1
          fi
          if ! grep -qF "No migrations to apply" "$RUNNER_TEMP/after.txt"; then
            echo "::error::migrations are still pending after the apply"
            exit 1
          fi
          echo "no migration pending after the apply"

      - name: Summary (applied)
        if: steps.verify.outcome == 'success'
        env:
          PENDING: ${{ steps.pending.outputs.names }}
          BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
          TARGET_ENV: ${{ needs.plan.outputs.environment }}
        run: |
          {
            echo "### D1 migrations applied"
            echo
            echo "- Environment: \`$TARGET_ENV\`"
            for n in $PENDING; do echo "- \`$n\`"; done
            echo "- Time Travel bookmark before applying: \`$BOOKMARK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing is rolled back automatically (a restore overwrites the database, so it is a human decision).
      # Also runs when the job is cancelled or times out while the apply or the verify was running (their outcome is
      # then `cancelled`). It never runs when the apply was not started (outcome `skipped`), so it cannot print a
      # restore hint for a database that was not touched.
      - name: Summary (migration failed)
        if: always() && (steps.apply.outcome == 'failure' || steps.apply.outcome == 'cancelled' || steps.verify.outcome == 'failure' || steps.verify.outcome == 'cancelled')
        env:
          PENDING: ${{ steps.pending.outputs.names }}
          BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
        run: |
          {
            echo "### D1 migrations FAILED, the Worker deploy is skipped"
            echo
            echo "- Pending before the apply: \`$PENDING\`"
            echo "- Time Travel bookmark before applying: \`${BOOKMARK:-unknown}\`"
            echo
            echo "Some of the migrations may be applied (wrangler stops at the first error; whether one file is atomic is not documented)."
            echo "Check from \`worker/\` on the owner's machine: \`npx wrangler d1 migrations list cowlic --remote -c wrangler.local.toml\`."
            echo "Fix forward with a NEW migration, or restore the bookmark (design section 9.2); never edit an applied migration."
          } >> "$GITHUB_STEP_SUMMARY"

  # Needs `migrate` (ORDER RULE): `deploy` starts only after migrate finished successfully. A failed, rejected or
  # cancelled migrate job skips this job; so does a skipped one (nothing here treats a skipped migrate as a no-op:
  # when a deploy is planned `migrate` always runs and does its own "no pending migrations" no-op).
  deploy:
    name: deploy
    needs: [plan, migrate]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      # Pins: section 6 audit table (full commit SHAs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # no cache at all (section 6)

      # No secrets in this step's environment: install scripts of dependencies never see the token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Section 4.2. Validate first (allowlist, whole value, nothing echoed), mask second, substitute third.
      # wrangler.toml keeps its placeholder; wrangler.ci.toml (gitignored) lives next to it because wrangler resolves
      # `main` and `migrations_dir` relative to the config file. Mode 600. Never printed.
      - name: Write runner-local wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node --input-type=module - <<'EOF'
          const id = process.env.D1_DATABASE_ID ?? "";
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) {
            console.error("::error::D1_DATABASE_ID is missing or not a lowercase UUID");
            process.exit(1);
          }
          EOF
          echo "::add-mask::$D1_DATABASE_ID"
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const placeholder = "REPLACE_AFTER_d1_create";
          const src = readFileSync("wrangler.toml", "utf8");
          if (src.split(placeholder).length !== 2) {
            console.error("::error::wrangler.toml must contain the D1 placeholder exactly once");
            process.exit(1);
          }
          const out = src.replace(placeholder, () => process.env.D1_DATABASE_ID);
          if (out.includes(placeholder)) {
            console.error("::error::placeholder still present");
            process.exit(1);
          }
          writeFileSync("wrangler.ci.toml", out, { mode: 0o600 });
          console.log("runner-local config written");
          EOF

      # Section 4.3. GitHub masks the exact secret string only, and wrangler may print the bare host or the account
      # subdomain, so the URL, its host and the account subdomain label are registered as separate masks BEFORE the
      # deploy step. Validated first (https, no credentials, no path, no query), nothing is echoed except the masks.
      - name: Mask the Worker URL
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          node --input-type=module - <<'EOF'
          const raw = process.env.WORKER_URL ?? "";
          if (!/^https:\/\/[a-z0-9]([a-z0-9.-]*[a-z0-9])?\/?$/.test(raw)) {
            console.error("::error::WORKER_URL is missing or not a plain https base URL");
            process.exit(1);
          }
          const host = new URL(raw).hostname;
          const masks = new Set([raw, raw.replace(/\/$/, ""), raw.replace(/\/?$/, "/"), host]);
          // <worker>.<account-subdomain>.workers.dev -> the subdomain label
          const m = /^[a-z0-9-]+\.([a-z0-9-]+)\.workers\.dev$/.exec(host);
          if (m) masks.add(m[1]);
          for (const v of masks) console.log("::add-mask::" + v);
          EOF

      # The token is in the env of this step only. WRANGLER_OUTPUT_FILE_PATH makes wrangler write a machine-readable
      # record (NDJSON); only the version id is read from it, validated as a UUID, and the file is not printed.
      #
      # #272: the version carries --tag (the short git SHA) and --message ("GitHub Actions run <run id>: <commit title>"),
      # so that `wrangler versions list`, `deployments list` and the dashboard show where it came from. (Source stays
      # "Unknown (version_upload)": Cloudflare's Workers Builds Git integration is a different mechanism with its own
      # build token and security model and is not used.) Limits of the API: tag 100 bytes, message 1000 bytes; the
      # values here are at most 7 and about 150 characters. Every value is checked against an allowlist HERE again (the
      # title comes from `plan` through a job output) and passed to wrangler as ONE quoted `--flag=value` argument, so
      # nothing can be split or read as another flag. No secret is ever part of them. The commit that is checked out must
      # be github.sha (the head of master per the guard): the tag is then the SHA that is deployed.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_TITLE: ${{ needs.plan.outputs.commit_title }}
        run: |
          case "$GIT_SHA" in
            "" | *[!0-9a-f]*) echo "::error::unexpected github.sha"; exit 1 ;;
          esac
          if [ "${#GIT_SHA}" -ne 40 ]; then
            echo "::error::unexpected github.sha"
            exit 1
          fi
          case "$RUN_ID" in
            "" | *[!0-9]*) echo "::error::unexpected run id"; exit 1 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$GIT_SHA" ]; then
            echo "::error::the checked-out commit is not github.sha: nothing is deployed"
            exit 1
          fi
          title="$COMMIT_TITLE"
          unsafe='[^A-Za-z0-9 ._,:;()#/+-]'
          if [ -z "$title" ] || [ "${#title}" -gt 100 ] || [[ "$title" =~ $unsafe ]]; then
            title="(no title)"
          fi
          tag="${GIT_SHA:0:7}"
          message="GitHub Actions run $RUN_ID: $title"
          {
            echo "tag=$tag"
            echo "message=$message"
          } >> "$GITHUB_OUTPUT"
          npx wrangler deploy -c wrangler.ci.toml --tag="$tag" --message="$message"

      # Separate step (no secrets) so that a parse failure is visible as such while the deploy itself stays "success":
      # the failure summary below then still prints the rollback text.
      - name: Read the deployed version id
        id: version
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";
          const lines = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n").filter(Boolean);
          let id = "";
          for (const l of lines) {
            try {
              const o = JSON.parse(l);
              if (o.type === "deploy" && typeof o.version_id === "string") id = o.version_id;
            } catch {
              // not a JSON line: ignored, the check below decides
            }
          }
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) {
            console.error("::error::could not read the deployed version id from the wrangler output");
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "version_id=" + id + "\n");
          EOF

      # Section 8. No credentials. Passes only on HTTP 200 with the Subsonic envelope status "failed" and error code 40.
      # Prints fixed texts only (no URL, no host, no response body).
      # Known limitation: it does NOT exercise D1, the Subsonic credentials or Telegram. Error 40 is also what the Worker
      # answers when its own secrets are missing (auth fails closed), so a deploy that lost them still passes: the owner
      # checks `wrangler secret list` after the first run. It also cannot show that the NEW version is the one serving:
      # the old version answers error 40 as well.
      - name: Health check
        id: health
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          node --input-type=module - <<'EOF'
          const url = new URL("/rest/ping?f=json", process.env.WORKER_URL);
          const tries = 5;
          for (let i = 1; i <= tries; i++) {
            let verdict;
            try {
              const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const body = await res.json();
              const sr = body && body["subsonic-response"];
              if (res.status === 200 && sr && sr.status === "failed" && sr.error && sr.error.code === 40) {
                console.log("health check passed (attempt " + i + "): Subsonic error 40 as expected");
                process.exit(0);
              }
              verdict = "unexpected response (HTTP " + res.status + ")";
            } catch {
              verdict = "request failed or the body was not JSON";
            }
            console.log("attempt " + i + "/" + tries + ": " + verdict);
            if (i < tries) await new Promise((r) => setTimeout(r, 5000));
          }
          console.error("::error::health check failed after " + tries + " attempts");
          process.exit(1);
          EOF

      # Nothing secret: version id (validated UUID), the git SHA, and the tag and message of the version (written by
      # the Deploy step from validated values: [0-9a-f] and the allowlisted charset, so no backtick can occur).
      - name: Summary
        if: success()
        env:
          VERSION_ID: ${{ steps.version.outputs.version_id }}
          GIT_SHA: ${{ github.sha }}
          VERSION_TAG: ${{ steps.deploy.outputs.tag }}
          VERSION_MESSAGE: ${{ steps.deploy.outputs.message }}
        run: |
          {
            echo "### Worker deployed"
            echo
            echo "- Version id: \`$VERSION_ID\`"
            echo "- Git SHA: \`$GIT_SHA\`"
            echo "- Version tag: \`$VERSION_TAG\`"
            echo "- Version message: \`$VERSION_MESSAGE\`"
            echo "- Health check: passed (limited: does not exercise D1 or credentials)"
          } >> "$GITHUB_STEP_SUMMARY"

      # No automatic rollback (a rollback is a production change and needs a human decision). Runs only when the
      # deploy itself succeeded and anything after it failed (reading the version id, the health check).
      - name: Summary (failure after deploy)
        if: always() && steps.deploy.outcome == 'success' && (steps.version.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          VERSION_ID: ${{ steps.version.outputs.version_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Worker deployed, a step after the deploy FAILED (version id or health check)"
            echo
            echo "- Version id: \`${VERSION_ID:-unknown}\`"
            echo "- Git SHA: \`$GIT_SHA\`"
            echo
            echo "Roll back by hand (owner, from \`worker/\` on the owner's machine), then check the Symfonium login:"
            echo
            echo '```'
            echo 'npx wrangler rollback --message "health check failed" -c wrangler.local.toml'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Release stage (#290 part 3, owner decision (a) of 2026-10-14): tag EVERY master commit vX.Y.Z (idempotent), create
  # the GitHub Release (generated notes) only for feat, fix, perf and breaking commits or on a manual dispatch.
  # Runs only on push to master and workflow_dispatch from master in this repository (never pull_request,
  # merge_group, fork) and only after the deploy chain is done: plan succeeded and EITHER nothing was to be deployed
  # (migrate and deploy skipped by design) OR migrate and deploy both succeeded. A failed, cancelled or rejected
  # migrate or deploy, a failed plan or a failed gate never releases. `!cancelled()` is needed because migrate and
  # deploy are legitimately skipped when there is nothing to deploy (a skipped need would otherwise skip this job).
  # The ONLY job with contents: write (to create the tag and the Release through the REST API with the job's
  # GITHUB_TOKEN: no PAT, no push from a checkout, no environment, no deploy secret, nothing of Cloudflare). The group
  # worker-deploy of the workflow serializes it with the other pushes.
  # The version comes from the audited GitVersion.Tool (same install as the job `version`), never from user input or
  # the PR title. The tag name is built only from MajorMinorPatch after a strict check (branch master, no prerelease
  # label, X.Y.Z). A tag is never moved, deleted or forced: an existing tag on THIS commit is a no-op, on another
  # commit or any unexpected state the job fails. If master moved on after this commit the job ends green WITHOUT a tag
  # (a newer run tags its own commit); so under fast merging not every commit gets a tag.
  release:
    name: release
    needs: [changes, lint, tests, ci, plan, migrate, deploy]
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.plan.result == 'success' && ((needs.plan.outputs.deploy != 'true' && needs.migrate.result == 'skipped' && needs.deploy.result == 'skipped') || (needs.plan.outputs.deploy == 'true' && needs.migrate.result == 'success' && needs.deploy.result == 'success')) && github.repository == 'kolenkainc/cowlic' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Exact tool version (audit in docs/releasing.md). Never upgrade without confirmation.
      GITVERSION_TOOL_VERSION: "6.8.2"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth 0: GitVersion needs the full history and all tags. No credentials are kept in the checkout: nothing
      # here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GitVersion.Tool
        run: |
          dotnet --list-sdks
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version "$GITVERSION_TOOL_VERSION"

      # Everything untrusted (the commit message is written by whoever merges) is data: it comes through the API into a
      # shell variable and is only matched with [[ =~ ]], never put in a command line, a summary or an expression.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          is_sha() {
            case "$1" in
              "" | *[!0-9a-f]*) return 1 ;;
            esac
            [ "${#1}" -eq 40 ]
          }
          is_sha "$EVENT_SHA" || fail "unexpected github.sha"
          # Only the head of master is tagged. Fail closed when it cannot be read.
          if ! master=$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha); then
            fail "cannot read the head of master"
          fi
          is_sha "$master" || fail "unexpected master head value"
          if [ "$master" != "$EVENT_SHA" ]; then
            echo "::notice::master moved on after this commit: no tag from this run, a newer run tags its own commit"
            {
              echo "### Release skipped"
              echo
              echo "- Commit \`$EVENT_SHA\` is no longer the head of master: no tag from this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$(git rev-parse HEAD)" = "$EVENT_SHA" ] || fail "the checked-out commit is not github.sha"
          # The version: GitVersion output only, strictly validated. Not on master, with a prerelease label, or anything
          # but X.Y.Z means no tag.
          "$RUNNER_TEMP/gitversion/dotnet-gitversion" . /output json /verbosity Quiet > "$RUNNER_TEMP/release-version.json" || fail "GitVersion failed"
          version=$(jq -r '.MajorMinorPatch // ""' "$RUNNER_TEMP/release-version.json") || fail "cannot read the version"
          label=$(jq -r '.PreReleaseLabel // ""' "$RUNNER_TEMP/release-version.json") || fail "cannot read the version"
          branch=$(jq -r '.BranchName // ""' "$RUNNER_TEMP/release-version.json") || fail "cannot read the version"
          [ "$branch" = "master" ] || fail "GitVersion did not compute the version on the branch master"
          [ -z "$label" ] || fail "the version has a prerelease label: nothing is tagged"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "the version is not X.Y.Z: nothing is tagged"
          tag="v$version"
          # Idempotent and never moving: the same commit is a no-op, anything else fails.
          existing=""
          if out=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2> "$RUNNER_TEMP/tagcheck.err"); then
            existing="$out"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/tagcheck.err"; then
            existing=""
          else
            fail "cannot read the tag $tag"
          fi
          if [ -n "$existing" ]; then
            read -r obj_type obj_sha <<< "$existing"
            [ "$obj_type" = "commit" ] || fail "the tag $tag exists and is not a lightweight tag: nothing is changed"
            is_sha "$obj_sha" || fail "unexpected tag value"
            [ "$obj_sha" = "$EVENT_SHA" ] || fail "the tag $tag exists on another commit: tags are never moved"
            echo "tag $tag is already on this commit"
            created=no
          else
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$EVENT_SHA" > /dev/null || fail "cannot create the tag $tag"
            echo "created tag $tag"
            created=yes
          fi
          # The GitHub Release only for feat, fix, perf and breaking commits (Conventional Commit subject of the squash
          # commit, or a BREAKING CHANGE footer) and for a manual dispatch.
          if ! message=$(gh api "repos/$REPO/commits/$EVENT_SHA" --jq '.commit.message // ""'); then
            fail "cannot read the commit message"
          fi
          subject="${message%%$'\n'*}"
          re_type='^(feat|fix|perf)(\([^)]*\))?!?:'
          re_breaking='^[A-Za-z]+(\([^)]*\))?!:'
          re_footer=$'(^|\n)BREAKING[ -]CHANGE:'
          release=no
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release=yes
          elif [[ "$subject" =~ $re_type ]] || [[ "$subject" =~ $re_breaking ]] || [[ "$message" =~ $re_footer ]]; then
            release=yes
          fi
          released=no
          if [ "$release" = "yes" ]; then
            if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
              echo "the release $tag already exists"
            else
              gh release create "$tag" --repo "$REPO" --verify-tag --generate-notes --title "$tag" > /dev/null || fail "cannot create the release $tag"
              echo "created release $tag"
              released=yes
            fi
          else
            echo "no GitHub Release for this commit (only feat, fix, perf, breaking commits and manual runs get one)"
          fi
          {
            echo "### Release"
            echo
            echo "- Tag: \`$tag\` on \`$EVENT_SHA\` (created now: $created)"
            echo "- GitHub Release for this commit: $release (created now: $released)"
          } >> "$GITHUB_STEP_SUMMARY"
